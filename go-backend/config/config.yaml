server:
  port: 8080
  mode: debug  # debug/release

log:
  dir: logs
  level: info  # debug/info/warn/error
  maxAge: 30  # 日志保留天数
  compress: false  # 是否压缩

database:
  host: localhost
  port: 3306
  user: root
  password: 11111111
  dbname: ai_eval
  charset: utf8mb4
  parseTime: true
  loc: Local
  maxIdleConns: 10
  maxOpenConns: 100

redis:
  addr: localhost:6379
  password: "111111"
  db: 1
  poolSize: 10

session:
  secret: yupi
  maxAge: 2592000  # 30天（与Java保持一致）
  cookieName: sessionId

openrouter:
  apiKey: ""  # set via env OPENROUTER_API_KEY or fill locally; never commit real keys
  baseURL: "https://openrouter.ai/api/v1"

rabbitmq:
  host: localhost
  port: 5672
  username: guest
  password: guest

# 腾讯云 COS（与 Java application.yml 的 tencent.cos 对齐，用于图片上传）
tencent:
  cos:
    accessKey: ""
    secretKey: ""
    region: ap-guangzhou
    bucket: your-bucket
    host: ""   # 留空则自动使用 https://{bucket}.cos.{region}.myqcloud.com
